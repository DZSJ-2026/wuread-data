.stat-card .value.red{color:#f56c6c}.stat-card .value.green{color:#67c23a}.stat-card .value.orange{color:#e6a23c}
.table-wrap{background:#fff;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.06);overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed}
th{background:#f5f7fa;color:#606266;font-weight:600;padding:10px 12px;text-align:left;border-bottom:2px solid #ebeef5;white-space:nowrap;position:sticky;top:0;z-index:1;overflow:hidden;text-overflow:ellipsis}
td{padding:8px 12px;border-bottom:1px solid #ebeef5;color:#303133;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
tr:hover td{background:#f5f7fa}
/* 可调整列宽 */
th .resizer{position:absolute;right:0;top:0;bottom:0;width:5px;cursor:col-resize;user-select:none}
th .resizer:hover,th .resizer.active{background:#409eff}
th{position:relative}
/* 是否新剧标签 */
.tag-new{display:inline-block;padding:2px 6px;border-radius:3px;font-size:11px;font-weight:600}
.tag-new-yes{background:#fef0f0;color:#f56c6c}.tag-new-no{background:#f0f9eb;color:#67c23a}
.cell-red{color:#f56c6c;font-weight:600}.cell-orange{color:#e6a23c;font-weight:600}.cell-green{color:#67c23a;font-weight:600}
.tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:12px;font-weight:600}
.tag-yes{background:#ecf5ff;color:#409eff}.tag-no{background:#f0f9eb;color:#67c23a}
.tag-time{background:#f4f4f5;color:#909399;font-size:11px;margin-left:4px}
.tag-broadcast{display:inline-block;padding:2px 6px;border-radius:3px;font-size:11px;font-weight:600}
.tag-broadcast-yes{background:#f0f9eb;color:#67c23a}.tag-broadcast-no{background:#f4f4f5;color:#c0c4cc}
.empty{text-align:center;padding:40px;color:#999}
.auto-info{text-align:center;padding:8px;font-size:11px;color:#c0c4cc}

#pw-gate{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.45);z-index:99999;display:flex;align-items:center;justify-content:center}
#pw-gate.hidden{display:none}
#pw-box{background:#fff;border-radius:12px;padding:36px 32px;width:320px;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.2)}
#pw-box h2{font-size:18px;color:#303133;margin-bottom:20px}
#pw-input{width:100%;padding:10px 14px;border:1px solid #dcdfe6;border-radius:6px;font-size:15px;outline:none;margin-bottom:14px;transition:border .2s}
#pw-input:focus{border-color:#409eff}
#pw-btn{width:100%;padding:10px;background:#409eff;color:#fff;border:none;border-radius:6px;font-size:15px;cursor:pointer;transition:background .2s}
#pw-btn:hover{background:#66b1ff}
#pw-err{color:#f56c6c;font-size:13px;margin-top:10px;min-height:18px}
#app-content{display:none}
#app-content.unlocked{display:block}

</head>

var COL_IDX={'日期':0,'产品':1,'短剧名称':2,'是否新剧':3,'消耗':4,'预估ROI':5,'政策返点后ROI':6,'官小政策系数':7,'自营政策系数':8};
document.getElementById('updateTime').textContent=DATA.lastUpdate;
document.getElementById('totalCount').textContent=DATA.timestamps.length;
var tsSelect=document.getElementById('timeFilter');
DATA.timestamps.slice().reverse().forEach(function(t){var o=document.createElement('option');o.value=t;o.textContent=t;tsSelect.appendChild(o)});
tsSelect.value=DATA.timestamps[DATA.timestamps.length-1];

// 列宽默认配置
var COL_WIDTHS=[80,80,200,70,100,80,100,100,100];

function renderHeader(){
  var h=document.getElementById('tableHead');
  var html='<tr><th style="width:60px">类型</th><th style="width:140px">更新时间</th>';
  DATA.headers.forEach(function(hh,i){
    var w=COL_WIDTHS[i]||100;
    html+='<th style="width:'+w+'px">'+hh+'<div class="resizer" data-col="'+i+'"></div></th>';
  });
  html+='</tr>';
  h.innerHTML=html;
  initResizers();
}

// 列宽调整
function initResizers(){
  document.querySelectorAll('.resizer').forEach(function(r){
    var startX,startW,col=parseInt(r.dataset.col);
    function onMouseDown(e){
      startX=e.pageX;startW=r.parentElement.offsetWidth;
      r.classList.add('active');
      document.addEventListener('mousemove',onMouseMove);
      document.addEventListener('mouseup',onMouseUp);
      e.preventDefault();
    }
    function onMouseMove(e){
      var diff=e.pageX-startX;
      var newW=Math.max(40,startW+diff);
      var th=r.parentElement;
      th.style.width=newW+'px';
      // 更新同列所有td
      var idx=Array.from(th.parentElement.children).indexOf(th);
      document.querySelectorAll('#tableBody tr').forEach(function(tr){
        if(tr.children[idx])tr.children[idx].style.width=newW+'px';
      });
    }
    function onMouseUp(){
      r.classList.remove('active');
      document.removeEventListener('mousemove',onMouseMove);
      document.removeEventListener('mouseup',onMouseUp);
    }
    r.addEventListener('mousedown',onMouseDown);
  });
}

function getCellClass(ci,val){
  var hdr=DATA.headers[ci]||'';
  var num=parseFloat(String(val).replace(/,/g,''));
  if(isNaN(num))return'';
  if(hdr.indexOf('消耗')>=0){
    if(num>=100000)return'cell-red';
    if(num>=30000)return'cell-orange';
  }
  if(hdr.indexOf('ROI')>=0||hdr.indexOf('roi')>=0){
    var p=val.indexOf('%')>=0?num:num*100;
    if(p>=70)return'cell-green';
    if(p<50)return'cell-red';
  }
  return'';
}

function formatNewDrama(val){
  if(val==='是')return'<span class="tag-new tag-new-yes">新剧</span>';
  if(val==='否')return'<span class="tag-new tag-new-no">非新剧</span>';
  return val||'--';
}

function renderTable(rows){
  var tb=document.getElementById('tableBody');
  if(!rows.length){
    tb.innerHTML='<tr><td colspan="'+(DATA.headers.length+2)+'" class="empty">暂无数据</td></tr>';
    updateStats([]);
    return;
  }
  var html='';
  rows.forEach(function(r){
    html+='<tr><td><span class="tag tag-'+(r.filter==='是'?'yes':'no')+'">'+r.filter+'</span></td>';
    html+='<td><span class="tag-time">'+r.time+'</span></td>';
    r.cells.forEach(function(c,i){
      var cls=getCellClass(i,c);
      var display=(DATA.headers[i]==='是否新剧')?formatNewDrama(c):c;
      html+='<td'+(cls?' class="'+cls+'"':'')+' title="'+c+'">'+display+'</td>';
    });
    html+='</tr>';
  });
  tb.innerHTML=html;
  updateStats(rows);
}

function updateStats(rows){
  var cost=0,revenue=0;
  var costIdx=COL_IDX['消耗'],roiIdx=COL_IDX['预估ROI'];
  rows.forEach(function(r){
    var c=parseFloat(String(r.cells[costIdx]||'').replace(/,/g,''));
    if(!isNaN(c))cost+=c;
  });
  document.getElementById('statsArea').innerHTML='<div class="stat-card"><div class="label">记录数</div><div class="value">'+rows.length+'</div></div><div class="stat-card"><div class="label">总消耗</div><div class="value '+(cost>=100000?'red':cost>=30000?'orange':'')+'">'+cost.toLocaleString('zh-CN',{maximumFractionDigits:2})+'</div></div>';
}

function applyFilter(){
  var ft=document.getElementById('filterType').value;
  var tt=document.getElementById('timeFilter').value;
  var nf=document.getElementById('newDramaFilter').value;
  var rows=DATA.rows;
  if(ft!=='all')rows=rows.filter(function(r){return r.filter===ft});
  if(tt!=='all')rows=rows.filter(function(r){return r.time===tt});
  if(nf!=='all'){
    var newIdx=COL_IDX['是否新剧'];
    rows=rows.filter(function(r){return r.cells[newIdx]===nf});
  }
  renderTable(rows);
}

function exportData(){
  var ft=document.getElementById('filterType').value;
  var tt=document.getElementById('timeFilter').value;
  var nf=document.getElementById('newDramaFilter').value;
  var rows=DATA.rows.slice();
  if(ft!=='all')rows=rows.filter(function(r){return r.filter===ft});
  if(tt!=='all')rows=rows.filter(function(r){return r.time===tt});
  if(nf!=='all'){
    var newIdx=COL_IDX['是否新剧'];
    rows=rows.filter(function(r){return r.cells[newIdx]===nf});
  }
  // 构建CSV
  var csv='\uFEFF'; // BOM for Excel
  csv+='官小类型,更新时间,'+DATA.headers.join(',')+'\n';
  rows.forEach(function(r){
    var line=r.filter+','+r.time+',';
    line+=r.cells.map(function(c){return '"'+String(c||'').replace(/"/g,'""')+'"';}).join(',');
    csv+=line+'\n';
  });
  // 下载
  var blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;
  var ts=new Date().toISOString().slice(0,19).replace(/:/g,'-');
  a.download='点众智投数据_'+ts+'.csv';
  a.click();
  URL.revokeObjectURL(url);
}

renderHeader();applyFilter();

<script>
async function sha256(t){const b=new TextEncoder().encode(t);const h=await crypto.subtle.digest('SHA-256',b);return Array.from(new Uint8Array(h)).map(x=>x.toString(16).padStart(2,'0')).join('')}
function unlockContent(){document.getElementById('pw-gate').classList.add('hidden');document.getElementById('app-content').classList.add('unlocked')}
async function checkPw(){const pw=document.getElementById('pw-input').value;const h=await sha256(pw);if(h==='e9268a8f0a453300457b61044b19dd113761355a0765ad860e4c25527b6c1066'){localStorage.setItem('pw_ok',Date.now().toString());unlockContent()}else{document.getElementById('pw-err').textContent='密码错误';document.getElementById('pw-input').value='';document.getElementById('pw-input').focus()}}
document.getElementById('pw-input').addEventListener('keydown',function(e){if(e.key==='Enter')checkPw()});
(function(){var t=localStorage.getItem('pw_ok');if(t&&(Date.now()-parseInt(t))<86400000)unlockContent()})();
</script>
